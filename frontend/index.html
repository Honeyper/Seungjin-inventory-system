<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>승진 관리 프로그램</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260918-typography-v2-prd-login-minimal-r114" />
    <link rel="stylesheet" href="./login.css?v=20261016-smaller-logo-r115" />
  </head>
  <body class="login-body login-simple">
    <main class="login-page" aria-labelledby="page-title">
      <form class="login-card" id="loginForm">
        <header class="login-card-header">
          <img class="login-logo" src="./assets/seungjin-vertical.svg?v=20261016" alt="승진" width="560" height="538" />
          <h1 id="page-title">승진 관리 프로그램</h1>
        </header>

        <label class="field" data-login-field="accountId">
          <span>아이디</span>
          <span class="input-control">
            <svg class="login-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1.5a7 7 0 0 1 14 0V20"/></svg>
            <input id="accountId" name="accountId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="아이디" aria-describedby="accountIdHint" />
            <svg class="field-valid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          </span>
          <small class="field-hint" id="accountIdHint">아이디를 입력해주세요.</small>
        </label>

        <label class="field" data-login-field="password">
          <span>비밀번호</span>
          <span class="password-control">
            <svg class="login-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" aria-describedby="passwordHint" />
            <svg class="field-valid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
            <button class="show-password" type="button" aria-label="비밀번호 보기">
              <i class="ti ti-eye" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="login-eye-slash" d="m3 3 18 18"/></svg></i>
            </button>
          </span>
          <small class="field-hint" id="passwordHint">비밀번호를 입력해주세요.</small>
        </label>

        <p class="login-message" id="loginMessage" role="alert" aria-live="polite"></p>
        <button class="login-button" type="submit">
          <span class="login-button-label">로그인</span>
          <i class="ti ti-arrow-right login-button-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></i>
        </button>
      </form>
    </main>

    <script src="./config.js"></script>
    <script src="./http-client.js?v=20260918-reliability-r20"></script>
    <script src="./supabase-gateway.js?v=20260918-reliability-r20"></script>
    <script src="./app.js?v=20260901-supabase-prd-2-reliability-r20"></script>
  </body>
</html>
